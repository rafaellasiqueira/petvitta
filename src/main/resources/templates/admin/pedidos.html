<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pedidos</title>

    <!-- font awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- sidebar css -->
    <link rel="stylesheet" th:href="@{/css/admin/sidebar.css}">

    <!-- Global CSS -->
    <link rel="stylesheet" th:href="@{/css/admin/global.css}">

    <!-- Pedidos CSS -->
    <link rel="stylesheet" th:href="@{/css/admin/pedidos.css}">
</head>

<body>

<div class="container">

    <!-- sidebar -->
    <div th:replace="~{fragments/admin/sidebar :: sidebar}"></div>

    <!-- conteudo -->
    <div class="conteudo">
        <!-- cabecalho -->
        <header class="cabecalho">
            <h1>Pedidos</h1>
        </header>

        <main class="card">
            <!-- filtros -->
            <div class="filtros">
                <!-- lado esquerdo -->
                <div class="botoes">
                    <button class="btn-filtro active">Todos</button>
                    <button class="btn-filtro">Em aberto</button>
                    <button class="btn-filtro">Em processamento</button>
                    <button class="btn-filtro">Pagamento realizado</button>
                    <button class="btn-filtro">Em trânsito</button>
                    <button class="btn-filtro">Entregue</button>
                    <button class="btn-filtro">Cancelado</button>
                    <button class="btn-filtro">Pagamento recusado</button>
                </div>

                <!-- lado direito -->
                <div class="direito">
                    <div class="pesquisa"><i class="fa-solid fa-magnifying-glass"></i>
                        <input type="text"
                               id="inputPesquisa"
                               placeholder="Buscar pelo código ou cliente"></div>
                </div>
            </div>

            <!-- tabela -->
            <table>
                <thead>
                <tr>
                    <th>Código</th>
                    <th>Cliente</th>
                    <th>Itens</th>
                    <th>Data da compra</th>
                    <th>Status</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr>
                    <td>PEDI001</td>
                    <td>Letícia Gomes de Souza</td>
                    <td>2</td>
                    <td>16/08/2026</td>
                    <td><select class="dropdown">
                        <option value="Em aberto" selected>Em aberto</option>
                        <option value="Em processamento">Em processamento</option>
                        <option value="Pagamento realizado">Pagamento realizado</option>
                        <option value="Em trânsito">Em trânsito</option>
                        <option value="Entregue">Entregue</option>
                        <option value="Cancelado">Cancelado</option>
                        <option value="Pagamento recusado">Pagamento recusado</option>
                    </select>
                    </td>
                    <td>
                        <i class="fa-solid fa-eye btn-detalhes"
                           data-codigo="PEDI001"
                           data-cliente="Letícia Gomes de Souza"
                           data-data="16/08/2026"

                           data-data-aprovacao="16/08/2026"
                           data-previsao-entrega="20/08/2026"
                           data-data-entrega="20/08/2026"
                           data-data-cancelamento="17/08/2026"
                           data-data-recusa="16/08/2026"

                           data-produtos="Ração Golden 10kg|Petisco de Carne"
                           data-subtotal="R$ 100,00"
                           data-descontos="R$ 10,00"
                           data-total="R$ 90,00"
                           data-endereco="Rua das Flores, 123 - São Paulo/SP">
                        </i>
                    </td>
                </tbody>
            </table>

            <!-- paginacao -->
            <div class="paginacao">
                <button type="button" class="btn-paginacao" disabled><i class="fa-solid fa-chevron-left"></i></button>
                <span class="paginacao-item active">1</span>
                <span class="paginacao-item">2</span>
                <span class="paginacao-item">3</span>
                <button type="button" class="btn-paginacao"><i class="fa-solid fa-chevron-right"></i></button>
            </div>

            <!-- modal de detalhes -->
            <div id="modalPedidos" class="modal">
                <div class="modalConteudo">
                    <div class="modalCabecalho">
                        <h2 id="modalStatus"></h2>
                        <button class="btn-fechar" id="btnFecharModal">&times;</button> <!-- Exibe o simbolo x -->
                    </div>
                    <div class="modal-body">
                        <p><strong>Código do pedido:</strong> <span id="modalCodigo"></span></p>
                        <p><strong>Cliente:</strong> <span id="modalCliente"></span></p>
                        <p><strong>Data da compra:</strong> <span id="modalData"></span></p>
                        <p id="secaoStatus"><strong id="labelStatus"></strong><span id="modalDataStatus"></span></p>

                        <div class="secao">
                            <p><strong>Produtos:</strong></p>
                            <p><span id="modalProdutos"></span></p>
                        </div>
                        <div class="secao">
                            <p><strong>Resumo do pagamento</strong></p>
                            <p><strong>Subtotal:</strong> <span id="modalSubtotal"></span></p>
                            <p><strong>Descontos:</strong> <span id="modalDescontos"></span></p>
                            <p><strong>Total:</strong> <span id="modalTotal"></span></p>
                        </div>

                        <div class="secao">
                            <p><strong>Endereço de entrega</strong></p>
                            <p><span id="modalEndereco"></span></p>
                        </div>
                    </div>
                </div>
            </div>

        </main>
    </div>
</div>

<!-- JavaScript -->
<script th:src="@{/js/admin/pedidos.js}"></script>

</body>
</html>
