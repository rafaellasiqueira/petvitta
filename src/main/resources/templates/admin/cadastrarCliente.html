<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar cliente</title>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Sidebar CSS -->
    <link rel="stylesheet" th:href="@{/css/admin/sidebar.css}">

    <!-- Global CSS -->
    <link rel="stylesheet" th:href="@{/css/admin/global.css}">

    <!-- Cadastrar Cliente CSS -->
    <link rel="stylesheet" th:href="@{/css/admin/cadastrarCliente.css}">
</head>
<body>
<div class="container">

    <!-- Sidebar -->
    <div th:replace="~{fragments/admin/sidebar :: sidebar}"></div>

    <!-- Conteúdo -->
    <div class="conteudo">

        <!-- Cabeçalho -->
        <header class="cabecalho">
            <a th:href="@{/admin/clientes}" class="voltar"><i class="fa-solid fa-chevron-left"></i></a>
            <h1 id="tituloPagina">Cadastrar cliente</h1>
        </header>

        <div class="container-principal">

            <form class="form-cadastrar-cliente" method="post" id="formCadastroCliente">
                <input type="hidden" id="codigoCliente" name="codigoCliente" value="">

                <!-- Dados pessoais -->
                <div class="card">
                    <h1>Dados pessoais</h1>

                    <!-- Nome -->
                    <div class="campo-grupo">
                        <label for="nome">Nome</label>

                        <input type="text"
                               id="nome"
                               name="nome"
                               placeholder="Digite seu nome completo"
                               required>
                        <p class="mensagem-erro" id="erroNome"></p>
                    </div>

                    <!-- CPF -->
                    <div class="campo-grupo">
                        <label for="cpf">CPF</label>
                        <input type="text"
                               id="cpf"
                               name="cpf"
                               placeholder="000.000.000-00"
                               required>

                        <p class="mensagem-erro" id="erroCpf"></p>
                    </div>


                    <!-- Telefone -->
                    <div class="linha-campos">
                        <div class="campo-grupo">
                            <label for="tipoTelefone">Tipo de telefone</label>

                            <select id="tipoTelefone"
                                    name="tipoTelefone"
                                    required>

                                <option value=""
                                        disabled
                                        selected
                                        hidden>Selecione</option>

                                <option value="celular">Celular</option>

                                <option value="fixo">Fixo</option>
                            </select>

                            <p class="mensagem-erro" id="erroTipoTelefone"></p>
                        </div>


                        <div class="campo-grupo">
                            <label for="telefone">Telefone</label>

                            <input type="text"
                                   id="telefone"
                                   name="telefone"
                                   placeholder="(00) 00000-0000"
                                   required>

                            <p class="mensagem-erro" id="erroTelefone"></p>
                        </div>
                    </div>

                    <!-- Gênero + nascimento -->
                    <div class="linha-campos">
                        <div class="campo-grupo">
                            <label for="genero">Gênero</label>

                            <select id="genero"
                                    name="genero"
                                    required>

                                <option value=""
                                        disabled
                                        selected
                                        hidden>
                                    Selecione
                                </option>

                                <option value="feminino">Feminino</option>
                                <option value="masculino">Masculino</option>
                                <option value="outro">Outro</option>
                            </select>

                            <p class="mensagem-erro" id="erroGenero"></p>
                        </div>


                        <div class="campo-grupo">
                            <label for="dataNascimento">Data de nascimento</label>

                            <input type="date"
                                   id="dataNascimento"
                                   name="dataNascimento"
                                   required>

                            <p class="mensagem-erro" id="erroDataNascimento"></p>
                        </div>
                    </div>
                </div>

                <!-- Dados de acesso -->
                <div class="card">
                    <h1>Dados de acesso</h1>

                    <!-- E-mail -->
                    <div class="campo-grupo">

                        <label for="email">E-mail</label>

                        <input type="email"
                               id="email"
                               name="email"
                               placeholder="Digite o e-mail"
                               required>

                        <p class="mensagem-erro" id="erroEmail"></p>
                    </div>

                    <!-- Senha -->
                    <div class="campo-grupo">
                        <label for="senha">Senha</label>

                        <div class="campo-senha">

                            <input type="password"
                                   id="senha"
                                   name="senha"
                                   placeholder="Digite a senha"
                                   required>

                            <button type="button"
                                    class="btn-mostrar-senha"
                                    data-input="senha">

                                <i class="fa-solid fa-eye"></i>
                            </button>
                        </div>

                        <p class="mensagem-erro" id="erroSenha"></p>
                    </div>

                    <!-- Confirmar senha -->
                    <div class="campo-grupo">

                        <label for="confirmarSenha">Confirmar senha</label>
                        <div class="campo-senha">

                            <input type="password"
                                   id="confirmarSenha"
                                   name="confirmarSenha"
                                   placeholder="Digite a senha novamente"
                                   required>

                            <button type="button"
                                    class="btn-mostrar-senha"
                                    data-input="confirmarSenha">

                                <i class="fa-solid fa-eye"></i>
                            </button>
                        </div>

                        <p class="mensagem-erro" id="erroConfirmarSenha"></p>
                    </div>

                    <!-- Requisitos -->
                    <ul class="requisitos-senha">

                        <li>
                            - Conter no mínimo 8 caracteres
                        </li>

                        <li>
                            - Conter pelo menos uma letra maiúscula e uma letra minúscula
                        </li>

                        <li>
                            - Conter pelo menos um caractere especial
                        </li>
                    </ul>

                    <!-- Botão -->
                    <div class="container-btn-salvar">

                        <button type="submit"
                                class="btn-salvar"
                                id="btnSalvarCliente">
                            Cadastrar cliente
                        </button>

                    </div>
                </div>
            </form>
        </div>

        <div id="toast" class="toast">
            <i class="toast-icone fa-solid fa-check"></i>
            <p id="toastMensagem">Cliente cadastrado com sucesso!</p>
        </div>

    </div>
</div>


<!-- JavaScript -->
<script th:src="@{/js/admin/cadastrarCliente.js}"></script>

</body>
</html>
