<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login administrador</title>

    <!-- Font Awesome (Ícones) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Login CSS -->
    <link rel="stylesheet" th:href="@{/css/admin/login.css}">
</head>
<body>

<div class="conteudo">

    <div class="lado-esquerdo">
        <img class="logo" th:src="@{/images/logo-horizontal-branca.svg}">

        <div class="container-principal">
            <h1>Seja bem-vindo!</h1>
            <p>Administre com inteligência e precisão</p>

            <form method="post">
                <div class="input-grupo">
                    <label for="email">E-mail</label>
                    <input type="email"
                            id="email"
                            name="email"
                            placeholder="Digite seu e-mail"
                            required
                    >
                </div>

                <div class="input-grupo">
                    <label for="senha">Senha</label>
                    <div class="senha-container">
                        <input type="password"
                               id="senha"
                               name="senha"
                               placeholder="Digite sua senha"
                               required
                        >
                        <button type="button"
                                class="mostrar-senha"
                                onclick="mostrarSenha()"
                        >
                            <i id="icone-senha" class="fa-solid fa-eye"></i>
                        </button>

                    </div>
                </div>

                <button type="submit" id="btnEntrar">Entrar</button>

            </form>
        </div>
    </div>

    <div class="lado-direito">
        <img th:src="@{/images/login-lado-direito.png}">
    </div>

</div>

<!-- Login JavaScript -->
<script th:src="@{/js/admin/login.js}"></script>
</body>
</html>
