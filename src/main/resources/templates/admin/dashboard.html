<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>

    <!-- font awesome (icones) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- sidebar css -->
    <link rel="stylesheet" th:href="@{/css/admin/sidebar.css}">

    <!-- global css -->
    <link rel="stylesheet" th:href="@{/css/admin/global.css}">

    <!-- dashboard css -->
    <link rel="stylesheet" th:href="@{/css/admin/dashboard.css}">
</head>
<body>
<div class="container">
    <div th:replace="~{fragments/admin/sidebar :: sidebar}"></div>

    <div class="conteudo">
        <header class="cabecalho">
            <h1>Dashboard</h1>
        </header>

        <main class="card">

            <div class="cabecalho-grafico">
                <h2>Histórico de vendas</h2>

                <div class="filtros">
                    <div class="opcoes-comparacao">
                        <button type="button" class="btn-comparacao ativo" data-tipo="categorias">
                            Categorias
                        </button>
                        <button type="button" class="btn-comparacao" data-tipo="produtos">
                            Produtos
                        </button>
                    </div>

                    <form id="formDatas" method="POST"
                          th:action="@{/admin/dashboard/aplicar-datas}">
                        <div class="data">
                            <input type="date" id="dataInicio" name="dataInicio"
                                   th:value="${dataInicio}">

                            <span class="separador">-</span>

                            <input type="date" id="dataFim" name="dataFim"
                                   th:value="${dataFim}">
                        </div>

                        <div class="acoes">
                            <button type="submit" class="btn-aplicar" id="btnAplicar">
                                Aplicar
                            </button>

                            <button type="button" class="btn-exportar" id="btnExportar">
                                Exportar CSV
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <span class="linha-filtro"></span>

            <div class="grafico-container">
                <canvas id="graficoVendas"></canvas>
            </div>

            <!-- Toast -->
            <div id="toast"
                 class="toast ativo"
                 th:if="${mensagemToast}">

                <i th:if="${tipoToast == 'erro'}"
                   class="fa-solid fa-circle-xmark"></i>

                <i th:if="${tipoToast != 'erro'}"
                   class="fa-solid fa-check"></i>

                <p th:text="${mensagemToast}"></p>
            </div>
        </main>
    </div>
</div>

<!-- Chart.Js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<!-- Dashboard -->
<script th:inline="javascript">
    const dadosVendas = /*[[${dadosVendas}]]*/ {};
    const categorias = Object.keys(dadosVendas);
</script>


<script th:src="@{/js/admin/dashboard.js}"></script>

<!-- Toast.js -->
<script th:src="@{/js/cliente/componentes/toast.js}"></script>


</body>
</html>
