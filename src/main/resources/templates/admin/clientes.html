<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Clientes</title>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Sidebar CSS -->
    <link rel="stylesheet" th:href="@{/css/admin/sidebar.css}">

    <!-- Global CSS -->
    <link rel="stylesheet" th:href="@{/css/admin/global.css}">

    <!-- Clientes CSS -->
    <link rel="stylesheet" th:href="@{/css/admin/clientes.css}">
</head>
<body>

<div class="container">
    <!-- Sidebar -->
    <div th:replace="~{fragments/admin/sidebar :: sidebar}"></div>

    <div class="conteudo">
        <!-- Cabeçalho -->
        <header class="cabecalho">
            <h1>Clientes</h1>
        </header>

        <!-- Card -->
        <main class="card">
                <!-- Pesquisar -->
                <form th:action="@{/admin/clientes}"
                      method="GET">

                    <div class="direito">

                        <!-- Pesquisar por nome -->
                        <div class="pesquisa">

                            <i class="fa-solid fa-magnifying-glass"></i>

                            <input type="text"
                                   id="inputPesquisa"
                                   name="nome"
                                   th:value="${nome}"
                                   placeholder="Buscar pelo nome do cliente">

                        </div>

                        <!-- Botão filtrar -->
                        <button type="button"
                                class="btn-filtrar"
                                id="btnfiltrar">

                            <i class="fa-solid fa-filter"></i>
                            Filtrar
                        </button>

                    </div>


                    <!-- Painel de filtros -->
                    <div id="painelFiltro"
                         class="painel-filtro"
                         hidden>

                        <div class="grid-filtros">

                            <!-- CPF -->
                            <div class="campo-filtro">

                                <label for="filtroCpf">
                                    CPF
                                </label>

                                <input type="text"
                                       id="filtroCpf"
                                       name="cpf"
                                       th:value="${cpf}"
                                       placeholder="000.000.000-00">

                            </div>


                            <!-- E-mail -->
                            <div class="campo-filtro">

                                <label for="filtroEmail">
                                    E-mail
                                </label>

                                <input type="email"
                                       id="filtroEmail"
                                       name="email"
                                       th:value="${email}"
                                       placeholder="cliente@email.com">

                            </div>


                            <!-- Telefone -->
                            <div class="campo-filtro">

                                <label for="filtroTelefone">
                                    Telefone
                                </label>

                                <input type="text"
                                       id="filtroTelefone"
                                       name="telefone"
                                       th:value="${telefone}"
                                       placeholder="(00) 00000-0000">

                            </div>


                            <!-- Data de nascimento -->
                            <div class="campo-filtro">

                                <label for="filtroDataNascimento">
                                    Data de Nascimento
                                </label>

                                <input type="date"
                                       id="filtroDataNascimento"
                                       name="dataNascimento"
                                       th:value="${dataNascimento}">

                            </div>


                            <!-- Gênero -->
                            <div class="campo-filtro">

                                <label for="filtroGenero">
                                    Gênero
                                </label>

                                <select id="filtroGenero"
                                        name="genero">

                                    <option value="">
                                        Todos
                                    </option>

                                    <option th:each="generoItem : ${generos}"
                                            th:value="${generoItem.id}"
                                            th:text="${generoItem.descricao}"
                                            th:selected="${generoItem.id == genero}">
                                    </option>

                                </select>

                            </div>


                            <!-- Status -->
                            <div class="campo-filtro">

                                <label for="filtroStatus">
                                    Status
                                </label>

                                <select id="filtroStatus"
                                        name="status">

                                    <option value="">
                                        Todos
                                    </option>

                                    <option value="true"
                                            th:selected="${status == true}">
                                        Ativo
                                    </option>

                                    <option value="false"
                                            th:selected="${status == false}">
                                        Inativo
                                    </option>

                                </select>

                            </div>

                        </div>


                        <!-- Botões -->
                        <div class="acoes-filtro">

                            <button type="reset"
                                    class="btn-limpar">
                                Limpar Filtros
                            </button>

                            <button type="submit"
                                    class="btn-aplicar">
                                Aplicar Filtros
                            </button>

                        </div>

                    </div>

                </form>

            <!-- Tabela -->
            <table th:if="${not #lists.isEmpty(clientes)}">
                <thead>
                <tr>
                    <th>Código</th>
                    <th>Cliente</th>
                    <th>CPF</th>
                    <th>E-mail</th>
                    <th>Ranking</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>

                <tr th:each="cliente : ${clientes}">

                    <td th:text="${'CL-' + cliente.codigo}">
                    </td>

                    <td th:text="${cliente.nome}">
                    </td>

                    <td th:text="${cliente.cpf}">
                    </td>

                    <td th:text="${cliente.email}">
                    </td>

                    <td th:text="${cliente.ranking}">
                    </td>

                    <td class="linha-acoes">

                        <a th:href="@{/admin/detalhesCliente/{id}(id=${cliente.id})}"
                           class="btn-detalhes">
                            <i class="fa-solid fa-eye"></i>
                        </a>

                        <button type="button"
                                class="btn-inativar"
                                th:if="${cliente.ativo}"
                                th:attr="data-id=${cliente.id}">
                            Inativar
                        </button>

                        <button type="button"
                                class="btn-ativar"
                                th:unless="${cliente.ativo}"
                                th:attr="data-id=${cliente.id}">
                            Ativar
                        </button>

                    </td>

                </tr>

                </tbody>
            </table>

            <div th:if="${#lists.isEmpty(clientes)}" class="sem-resultados">
                <p>Nenhum cliente encontrado.</p>
            </div>

        </main>
    </div>
</div>

<!-- Modal inativar -->
<div id="modalInativarCliente" class="modal">
    <div class="modalConteudo">

        <div class="modalCabecalho">
            <h2>Inativar cliente</h2>
            <button type="button" class="btn-fechar" id="btnFecharModalInativar">&times;</button>
        </div>

        <form id="formInativarCliente" method="POST">
            <div class="modal-body">

                <p class="texto-modal">
                    Selecione o motivo e informe a justificativa para inativar este cliente.
                </p>

                <div class="campo-formulario">
                    <label for="motivoInativar">Motivo</label>

                    <select id="motivoInativar"
                            name="motivoInativar"
                            required>

                        <option value="" disabled selected hidden>
                            Selecione o motivo
                        </option>

                        <option th:each="motivo : ${motivosInativacao}"
                                th:value="${motivo.id}"
                                th:text="${motivo.descricao}">
                        </option>

                    </select>
                </div>

                <div class="campo-formulario">
                    <label for="justificativaInativar">Justificativa</label>

                    <textarea id="justificativaInativar"
                              name="justificativaInativar"
                              placeholder="Descreva o motivo da inativação"
                              maxlength="500"
                              required></textarea>
                </div>

                <div class="modalBotoes">
                    <button type="button" class="btn-cancelar" id="btnCancelarInativar">Cancelar</button>
                    <button type="submit"
                            class="btn-inativar-modal">
                        Inativar
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>

<!-- Ativar -->
<div id="modalAtivarCliente" class="modal">
    <div class="modalConteudo">
        <div class="modalCabecalho">
            <h2>Ativar cliente</h2>
            <button type="button" class="btn-fechar" id="btnFecharModalAtivar">&times;</button>
        </div>

        <form id="formAtivarCliente" method="POST">
            <div class="modal-body">

                <p class="texto-modal">
                    Selecione o motivo e informe a justificativa para ativar este cliente.
                </p>

                <div class="campo-formulario">
                    <label for="motivoAtivar">Motivo</label>

                    <select id="motivoAtivar"
                            name="motivoAtivar"
                            required>

                        <option value="" disabled selected hidden>
                            Selecione o motivo
                        </option>

                        <option th:each="motivo : ${motivosAtivacao}"
                                th:value="${motivo.id}"
                                th:text="${motivo.descricao}">
                        </option>

                    </select>
                </div>

                <div class="campo-formulario">
                    <label for="justificativaAtivar">Justificativa</label>

                    <textarea id="justificativaAtivar"
                              name="justificativaAtivar"
                              placeholder="Descreva o motivo da ativação"
                              maxlength="500"
                              required></textarea>
                </div>

                <div class="modalBotoes">
                    <button type="button" class="btn-cancelar" id="btnCancelarAtivar">Cancelar</button>
                    <button type="submit"
                            class="btn-ativar-modal">
                        Ativar
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>

<!-- Clientes JavaScript -->
<script th:src="@{/js/admin/clientes.js}"></script>

</body>
</html>
