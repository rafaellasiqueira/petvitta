<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
<header class="cabecalho" th:fragment="cabecalho">

    <!-- Primeira parte -->
    <div class="topo">
        <div class="logo-container">
            <img class="logo" th:src="@{/images/logo-horizontal-escura.svg}">
        </div>

        <form th:action="@{/cliente/produtos}" method="GET" class="barra-de-pesquisa">
            <input type="text"
                   name="nome"
                   placeholder="Pesquisar na PetVitta Club">

                <i class="fa-solid fa-magnifying-glass"></i>
        </form>

        <!-- Menu -->
        <div class="menu">

            <!-- Carrinho -->
            <a th:href="@{/cliente/carrinho}" class="menu-container">
                <i class="fa-solid fa-cart-shopping"></i>
                <span>Carrinho</span>
            </a>

            <!-- Meus pedidos -->
            <a th:href="@{/cliente/pedido}" class="menu-container">
                <i class="fa-solid fa-box"></i>
                <span>Meus pedidos</span>
            </a>

            <!-- Notificacao -->
            <a th:href="@{/cliente/notificacao}"
               class="menu-container">
                <div class="icone-notificacao">
                    <i class="fa-solid fa-bell"></i>
                </div>
            </a>

            <!-- Perfil -->
            <a th:href="@{/cliente/perfil}" class="menu-container">
                <i class="fa-solid fa-circle-user"></i>
            </a>

            <!-- Sair -->
            <a th:href="@{/cliente/login}" class="menu-container menu-sair" title="Sair da conta">
                <i class="fa-solid fa-right-from-bracket"></i>
            </a>
        </div>
    </div>

    <!-- Segunda parte -->
    <nav class="categorias">
        <a th:href="@{/cliente/produtos}" class="categorias-container">Todos</a>
        <span class="divisor">|</span>
        <a th:href="@{/cliente/produtos(categoria='Petisco')}"
           class="categorias-container">
            Petiscos
        </a>
        <a th:href="@{/cliente/produtos(categoria='Ração')}"
           class="categorias-container">
            Ração
        </a>
        <a th:href="@{/cliente/produtos(categoria='Suplemento')}"
           class="categorias-container">
            Suplementos
        </a>
    </nav>
</header>
</body>


</html>
