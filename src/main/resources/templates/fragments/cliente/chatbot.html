<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
<div th:fragment="chatbot">

    <!-- Chatbot -->
    <div class="chatbot" id="chatbot">

        <!-- Cabeçalho -->
        <div class="chatbot-cabecalho">
            <div class="chatbot-titulo">

                <div class="chatbot-logo">
                    <img th:src="@{/images/logo-icone-chatbot.svg}">
                </div>

                <p>Assistente virtual</p>
            </div>

            <div class="lado-direito-chatbot">
                <button type="button"
                        class="btn-limpar-chatbot"
                        id="btnLimparChatbot">
                    <i class="fa-regular fa-trash-can"></i>
                </button>

                <span class="separador"></span>

                <button type="button" class="btn-fechar-chatbot" id="btnFecharChatbot">&times;</button>
            </div>
        </div>

        <!-- Conversa -->
        <div class="chatbot-mensagens" id="chatbotMensagens">

            <div class="mensagem mensagem-bot">
                <p> Olá! Seja bem-vindo(a) à PetVitta Club!
                    Sou sua assistente virtual e estou pronta
                    para ajudar com recomendações de rações,
                    petiscos, suplementos e muito mais.
                    É só me dizer o que você precisa!</p>
            </div>

            <th:block th:each="mensagem : ${mensagens}">

                <div th:if="${mensagem.remetente == 'CLIENTE'}"
                     class="mensagem mensagem-usuario">

                    <p th:text="${mensagem.conteudo}"></p>

                </div>

                <div th:if="${mensagem.remetente == 'IA'}"
                     class="mensagem mensagem-bot"
                     th:data-mensagem-id="${mensagem.id}"
                     th:data-avaliacao="${mensagem.avaliacao}">

                    <p th:text="${mensagem.conteudo}"></p>

                    <div class="chatbot-avaliacao">
                        <div class="opcao-avaliacao">
                            <button type="button"
                                    class="botao-avaliacao"
                                    th:classappend="${mensagem.avaliacao == 'Útil'} ? 'selecionado' : ''"
                                    th:disabled="${mensagem.avaliacao != null and !mensagem.avaliacao.isEmpty()}">

                                <i class="fa-regular fa-thumbs-up"></i>

                            </button>

                            <span>Útil</span>
                        </div>

                        <div class="opcao-avaliacao">
                            <button type="button"
                                    class="botao-avaliacao"
                                    th:classappend="${mensagem.avaliacao == 'Não útil'} ? 'selecionado' : ''"
                                    th:disabled="${mensagem.avaliacao != null and !mensagem.avaliacao.isEmpty()}">

                                <i class="fa-regular fa-thumbs-down"></i>

                            </button>

                            <span>Não útil</span>
                        </div>
                    </div>
                </div>

            </th:block>

        </div>

        <!-- Campo de mensagem -->
        <form class="chatbot-form" id="formChatbot">
            <input type="text"
                   id="inputChatbot"
                   placeholder="Digite sua mensagem">

            <button type="submit"
                    id="btnEnviarChatbot">
                <i class="fa-solid fa-paper-plane"></i>
            </button>
        </form>
    </div>

    <!-- Botão flutuante -->
    <button type="button"
            class="chatbot-botao"
            id="btnAbrirChatbot">

        <div class="chatbot-botao-icon">

            <img th:src="@{/images/logo-icone-chatbot.svg}">
        </div>
    </button>

    <div th:replace="~{fragments/cliente/modais :: modal-confirmar-exclusao-chatbot}"></div>

</div>

</body>
</html>
