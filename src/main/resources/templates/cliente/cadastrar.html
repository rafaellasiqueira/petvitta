<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar cliente</title>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Cabeçalho CSS -->
    <link rel="stylesheet" th:href="@{/css/cliente/cabecalho.css}">

    <!-- Global CSS -->
    <link rel="stylesheet" th:href="@{/css/cliente/global.css}">

    <!-- Cadastro CSS -->
    <link rel="stylesheet" th:href="@{/css/cliente/cadastrar.css}">

</head>
<body>

<div class="container">

    <!-- Cabeçalho -->
    <header class="login-cabecalho">
        <div class="topo">
            <div class="logo-container">
                <img class="logo" th:src="@{/images/logo-horizontal-escura.svg}">
            </div>
        </div>
    </header>

    <!-- Conteúdo -->
    <main class="conteudo">
        <form class="form-cadastrar-cliente"
              th:action="@{/cliente/cadastrar}"
              th:object="${cliente}"
              method="post"
              id="formCadastroCliente">

        <!-- Dados pessoais -->
            <div class="card">
                <div class="titulo-card">
                    <h1>Dados pessoais</h1>
                </div>

                <!-- Nome -->
                <div class="campo-grupo">
                    <label for="nome">Nome</label>
                    <input type="text"
                           id="nome"
                           name="nome"
                           placeholder="Digite seu nome completo">
                    <p class="mensagem-erro" id="erroNome"></p>
                </div>

                <!-- CPF -->
                <div class="campo-grupo">
                    <label for="cpf">CPF</label>
                    <input type="text"
                           id="cpf"
                           name="cpf"
                           placeholder="000.000.000-00"
                           minlength="14"
                           maxlength="14"
                           inputmode="numeric">
                    <p class="mensagem-erro" id="erroCpf"></p>
                </div>

                <!-- Telefone -->
                <div class="linha-campos">
                    <div class="campo-grupo">
                        <label>Tipo de telefone</label>
                        <select th:field="*{tipoTelefone}" id="tipoTelefone">
                            <option value="" disabled selected hidden>Selecione</option>

                            <option
                                    th:each="tipo : ${tiposTelefone}"
                                    th:value="${tipo.id}"
                                    th:text="${tipo.descricao}">
                            </option>
                        </select>
                    </div>

                    <div class="campo-grupo">
                        <label for="telefone">Telefone</label>
                        <input type="text"
                               id="telefone"
                               name="telefone"
                               placeholder="(00) 00000-0000"
                               maxlength="15">
                        <p class="mensagem-erro" id="erroTelefone"></p>
                    </div>
                </div>

                <!-- Gênero + nascimento -->
                <div class="linha-campos">
                    <div class="campo-grupo">
                        <label>Gênero</label>
                        <select th:field="*{genero}">
                            <option value="" disabled selected hidden>Selecione</option>
                            <option
                                    th:each="genero : ${generos}"
                                    th:value="${genero.id}"
                                    th:text="${genero.descricao}">
                            </option>
                        </select>
                    </div>

                    <div class="campo-grupo">
                        <label for="dataNascimento">Data de nascimento</label>
                        <input type="date"
                               id="dataNascimento"
                               name="dataNascimento">
                        <p class="mensagem-erro" id="erroDataNascimento"></p>
                    </div>
                </div>
            </div>

            <!-- Dados de acesso -->
            <div class="card">
                <div class="titulo-card">
                    <h1>Dados de acesso</h1>
                </div>

                <!-- E-mail -->
                <div class="campo-grupo">
                    <label for="email">E-mail</label>
                    <input type="email"
                           id="email"
                           name="email"
                           placeholder="Digite o e-mail">
                    <p class="mensagem-erro" id="erroEmail"></p>
                </div>

                <!-- Senha -->
                <div class="campo-grupo">
                    <label for="senha">Senha</label>
                    <div class="campo-senha">
                        <input type="password"
                               id="senha"
                               name="senha"
                               placeholder="Digite a senha">
                        <button type="button" class="btn-mostrar-senha" data-input="senha">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                    <p class="mensagem-erro" id="erroSenha"></p>
                </div>

                <!-- Confirmar senha -->
                <div class="campo-grupo">
                    <label for="confirmarSenha">Confirmar senha</label>
                    <div class="campo-senha">
                        <input type="password"
                               id="confirmarSenha"
                               name="confirmarSenha"
                               placeholder="Digite a senha novamente">
                        <button type="button" class="btn-mostrar-senha" data-input="confirmarSenha">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                    <p class="mensagem-erro" id="erroConfirmarSenha"></p>
                </div>

                <!-- Requisitos -->
                <ul class="requisitos-senha">
                    <li>
                        - Conter no mínimo 8 caracteres
                    </li>
                    <li>
                        - Conter pelo menos uma letra maiúscula e uma letra minúscula
                    </li>
                    <li>
                        - Conter pelo menos um caractere especial
                    </li>
                </ul>
            </div>

            <!-- Endereços -->
            <div class="card">
                <div class="titulo-card">
                    <h1>Endereços</h1>
                </div>

                <!-- Lista de endereços -->
                <div id="listaEnderecos">

                    <!-- Primeiro Endereço -->
                    <div class="item-endereco endereco-item">

                        <!-- Título + remover -->
                        <div class="subtitulo-item">
                            <h2>Endereço</h2>
                            <button type="button" class="btn-remover-item" style="display: none;">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </div>

                        <!-- Nome identificação -->
                        <div class="campo-grupo">
                            <label>Nome de identificação</label>
                            <input type="text"
                                   name="enderecos[0].nomeIdentificacao"
                                   class="nome-identificacao"
                                   placeholder="Ex.: Casa, Trabalho..."
                                   minlength="3"
                                   maxlength="100">
                            <p class="mensagem-erro erroNomeIdentificacao"></p>
                        </div>

                        <!-- Tipo endereço -->
                        <div class="campo-grupo">
                            <label>Tipo de endereço</label>
                            <select th:field="*{enderecos[0].tipoEndereco}">
                                <option value="" disabled selected hidden>Selecione</option>

                                <option
                                        th:each="tipo : ${tiposEndereco}"
                                        th:value="${tipo.id}"
                                        th:text="${tipo.descricao}">
                                </option>
                            </select>
                            <p class="mensagem-erro erroTipoEndereco"></p>
                        </div>

                        <!-- Tipo residência -->
                        <div class="campo-grupo">
                            <label>Tipo de residência</label>
                            <select th:field="*{enderecos[0].tipoResidencia}">
                                <option value="" disabled selected hidden>Selecione</option>

                                <option
                                        th:each="tipo : ${tiposResidencia}"
                                        th:value="${tipo.id}"
                                        th:text="${tipo.descricao}">
                                </option>
                            </select>
                            <p class="mensagem-erro erroTipoResidencia"></p>
                        </div>

                        <!-- Tipo logradouro -->
                        <div class="campo-grupo">
                            <label>Tipo de logradouro</label>
                            <select th:field="*{enderecos[0].tipoLogradouro}">
                                <option value="" disabled selected hidden>Selecione</option>

                                <option
                                        th:each="tipo : ${tiposLogradouro}"
                                        th:value="${tipo.id}"
                                        th:text="${tipo.descricao}">
                                </option>
                            </select>
                            <p class="mensagem-erro erroTipoLogradouro"></p>
                        </div>

                        <!-- CEP -->
                        <div class="campo-grupo">
                            <label>CEP</label>
                            <input type="text"
                                   name="enderecos[0].cep"
                                   class="cep"
                                   placeholder="00000-000"
                                   maxlength="9"
                                   inputmode="numeric">
                            <p class="mensagem-erro erroCep"></p>
                        </div>

                        <!-- Logradouro -->
                        <div class="campo-grupo">
                            <label>Logradouro</label>
                            <input type="text"
                                   name="enderecos[0].logradouro"
                                   class="logradouro"
                                   placeholder="Digite o nome do logradouro">
                            <p class="mensagem-erro erroLogradouro"></p>
                        </div>

                        <!-- Bairro -->
                        <div class="campo-grupo">
                            <label>Bairro</label>
                            <input type="text"
                                   name="enderecos[0].bairro"
                                   class="bairro"
                                   placeholder="Digite o bairro">
                            <p class="mensagem-erro erroBairro"></p>
                        </div>

                        <!-- Número -->
                        <div class="campo-grupo">
                            <label>Número</label>
                            <input type="text"
                                   name="enderecos[0].numero"
                                   class="numero"
                                   placeholder="Digite o número"
                                   inputmode="numeric">
                            <p class="mensagem-erro erroNumero"></p>
                        </div>

                        <!-- Estado + cidade -->
                        <div class="linha-campos">
                            <div class="campo-grupo">
                                <label>Estado</label>
                                <select th:field="*{enderecos[0].estado}" class="estado">
                                    <option value="" disabled selected hidden>Selecione</option>
                                    <option
                                            th:each="estado : ${estados}"
                                            th:value="${estado.id}"
                                            th:text="|${estado.sigla} - ${estado.nome}|">
                                    </option>
                                </select>
                                <p class="mensagem-erro erroEstado"></p>
                            </div>

                            <div class="campo-grupo">
                                <label>Cidade</label>
                                <input type="text"
                                       name="enderecos[0].cidade"
                                       class="cidade"
                                       placeholder="Digite a cidade">
                                <p class="mensagem-erro erroCidade"></p>
                            </div>
                        </div>

                        <!-- País -->
                        <div class="campo-grupo">
                            <label>País</label>
                            <input type="text"
                                   name="enderecos[0].pais"
                                   class="pais"
                                   value="Brasil"
                                   placeholder="Digite o nome do país">
                            <p class="mensagem-erro erroPais"></p>
                        </div>

                        <!-- Observações -->
                        <div class="campo-grupo">
                            <label>
                                Observações
                                <span>(Opcional)</span>
                            </label>
                            <textarea name="enderecos[0].observacoes" placeholder="Digite alguma observação sobre o endereço"></textarea>
                        </div>
                    </div>

                </div>
                <!-- Adicionar endereço -->
                <button type="button" class="btn-adicionar-card" id="btnAdicionarEndereco">
                    Adicionar outro endereço
                </button>
            </div>

            <!-- Cartões -->
            <div class="card">
                <div class="titulo-card">
                    <h1>Cartões</h1>
                </div>

                <!-- Lista de cartões -->
                <div id="listaCartoes">

                    <!-- Primeiro cartão -->
                    <div class="item-cartao cartao-item">

                        <!-- Título + remover -->
                        <div class="subtitulo-item">
                            <h2>Cartão</h2>
                            <button type="button" class="btn-remover-item" style="display: none;">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </div>

                        <!-- Número -->
                        <div class="campo-grupo">
                            <label>Número do cartão</label>
                            <input type="text"
                                   name="cartoes[0].numero"
                                   class="numero-cartao"
                                   placeholder="0000 0000 0000 0000"
                                   maxlength="19">
                            <p class="mensagem-erro erroNumeroCartao"></p>
                        </div>

                        <!-- Nome -->
                        <div class="campo-grupo">
                            <label>Nome impresso no cartão</label>
                            <input type="text"
                                   name="cartoes[0].nomeImpresso"
                                   class="nome-cartao"
                                   placeholder="Digite o nome impresso no cartão"
                                   maxlength="50">
                            <p class="mensagem-erro erroNomeCartao"></p>
                        </div>

                        <!-- Bandeira -->
                        <div class="campo-grupo">
                            <label>Bandeira</label>
                            <select th:field="*{cartoes[0].bandeira}">
                                <option value="" disabled selected hidden>Selecione</option>

                                <option
                                        th:each="bandeira : ${bandeiras}"
                                        th:value="${bandeira.id}"
                                        th:text="${bandeira.descricao}">
                                </option>
                            </select>
                            <p class="mensagem-erro erroBandeiraCartao"></p>
                        </div>

                        <!-- CVV  -->
                            <div class="campo-grupo">
                                <label>CVV</label>
                                <input type="text"
                                       name="cartoes[0].codigoSeguranca"
                                       class="cvv-cartao"
                                       placeholder="000"
                                       maxlength="4">
                                <p class="mensagem-erro erroCvvCartao"></p>
                            </div>
                        <!-- Preferencial -->
                        <div class="preferencial">
                            <input type="radio"
                                   name="cartoes[0].preferencial"
                                   value="true"
                                   checked>
                            <label>Definir como cartão preferencial</label>
                        </div>
                    </div>
                </div>

                <!-- Adicionar cartão -->
                <button type="button" class="btn-adicionar-card" id="btnAdicionarCartao">
                    Adicionar outro cartão
                </button>
            </div>

            <!-- Salvar -->
            <div class="container-btn-salvar">
                <button type="submit" class="btn-salvar" id="btnSalvarCliente">
                    Cadastrar cliente
                </button>
            </div>
        </form>
    </main>

    <!-- Toast -->
    <div id="toast"
         class="toast">
        <i class="toast-icone fa-solid fa-check"></i>
        <p id="toastMensagem">Cadastrado concluído com sucesso!</p>
    </div>

</div>

<!-- JavaScript -->
<script th:src="@{/js/cliente/cadastro.js}"></script>

</body>
</html>
