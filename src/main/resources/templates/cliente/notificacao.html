<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Notificação</title>

    <!-- Font Awesome (Ícones) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Cabeçalho CSS -->
    <link rel="stylesheet" th:href="@{/css/cliente/cabecalho.css}">

    <!-- Global CSS -->
    <link rel="stylesheet" th:href="@{/css/cliente/global.css}">

    <!-- Notificação CSS -->
    <link rel="stylesheet" th:href="@{/css/cliente/notificacao.css}">

    <!-- Chatbot CSS -->
    <link rel="stylesheet" th:href="@{/css/cliente/chatbot.css}">
</head>

<body>
<div class="container">
    <!-- Cabeçalho -->
    <div th:replace="~{fragments/cliente/cabecalho :: cabecalho}"></div>

    <main class="conteudo">
        <div class="container-principal">

            <div class="notificacao-cabecalho">
                <h1>Notificações</h1>
            </div>

            <!-- Notificações cadastradas -->
            <div class="card"
                 th:each="notificacao : ${notificacoes}">

                <h2 th:text="${notificacao.titulo}"></h2>

                <p th:text="${notificacao.mensagem}"></p>

                <a th:if="${!notificacao.lida}"
                   th:href="@{/cliente/notificacao/lida/{id}(id=${notificacao.id})}"
                    class="marcar-lida">
                    Marcar como lida
                </a>
            </div>

            <div class="sem-resultados"
                 th:if="${#lists.isEmpty(notificacoes)}">
                <h2>Nenhuma notificação</h2>
                <p>Você não possui nenhuma notificação no momento.</p>
            </div>
        </div>
    </main>
</div>

<!-- Chatbot -->
<div th:replace="~{fragments/cliente/chatbot :: chatbot}"></div>
<script th:src="@{/js/cliente/chatbot.js}"></script>

</body>
</html>
