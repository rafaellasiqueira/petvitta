<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Finalizar a compra</title>

    <!-- Font awesome (icones) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Finalizar a compra CSS -->
    <link rel="stylesheet" th:href="@{/css/cliente/finalizar-compra.css}">

    <!-- Modal CSS -->
    <link rel="stylesheet" th:href="@{/css/cliente/modal.css}">

</head>

<body>
<div class="container">

    <header class="cabecalho">
        <a th:href="@{/cliente/carrinho}" class="voltar">
            <i class="fa-solid fa-chevron-left"></i>
            <span>Voltar</span>
        </a>

        <h1>Finalização da compra</h1>
    </header>


    <main class="conteudo">

        <!-- Coluna esquerda -->
        <div class="container-esquerdo">

            <!-- Endereço -->
            <div class="card">
                <div class="titulo-card">
                    <h2>Endereço de entrega</h2>
                </div>

                <!-- Endereço temporário -->
                <div class="endereco"
                     th:data-estado="${enderecoCompra.estado.sigla}"
                     th:if="${enderecoCompra != null and (enderecoCompra.tipoEndereco.descricao == 'Entrega' or enderecoCompra.tipoEndereco.descricao == 'Cobrança e Entrega')}">
                    <h3 id="enderecoTemporarioNome"
                        th:text="${enderecoCompra.nomeIdentificacao}">
                    </h3>

                    <p id="enderecoTemporarioLogradouro"
                       th:text="${enderecoCompra.logradouro + ', ' + enderecoCompra.numero + ' - ' + enderecoCompra.bairro + ', ' + enderecoCompra.cidade + ' - ' + enderecoCompra.estado.nome}">
                    </p>

                    <span id="enderecoTemporarioCep" th:text="${'CEP: ' + enderecoCompra.cep + ', Brasil.'}"></span>

                    <input type="hidden"
                           name="enderecoTemporarioId"
                           th:value="${enderecoCompra.id}"
                           form="formFinalizarCompra">

                    <button type="button" class="btnAlterarEndereco">Alterar endereço</button>
                </div>

                <!-- Endereço salvo -->
                <div class="endereco"
                     th:data-estado="${endereco.estado.sigla}"
                     th:if="${enderecoCompra == null and endereco != null}">

                    <h3 id="enderecoNome"
                        th:text="${endereco.nomeIdentificacao}">
                    </h3>

                    <p id="enderecoLogradouro"
                       th:text="${endereco.logradouro + ', ' + endereco.numero + ' - ' + endereco.bairro + ', ' + endereco.cidade + ' - ' + endereco.estado.nome}">
                    </p>

                    <span id="enderecoCep"
                          th:text="${'CEP: ' + endereco.cep + ', Brasil.'}"></span>

                    <input type="hidden"
                           name="enderecoId"
                           th:value="${endereco.id}"
                           form="formFinalizarCompra">

                    <button type="button" class="btnAlterarEndereco">Alterar endereço</button>
                </div>
        </div>

            <!-- Produtos-->
            <div class="card">
                <h2>Produtos</h2>

                <div th:each="item : ${carrinho.itens}"
                     th:if="${itensSelecionados.contains(item.id)}"
                     class="produto">
                    <div class="container-produto">
                        <div class="imagem-produto">
                            <img class="produto-imagem"
                                 th:src="${item.variacao.produto.imagemUrl}">
                        </div>

                        <div class="informacoes-produto">
                            <h3 th:text="${item.variacao.produto.nome}"></h3>
                            <span th:text="${'Tamanho: ' + item.variacao.tamanho}"></span>
                            <span class="quantidade-produto"
                                  th:text="${'Quantidade: ' + item.quantidade}">
                            </span>
                            <span class="preco"
                                  th:text="${'R$ ' + #numbers.formatDecimal(item.variacao.valorVenda * item.quantidade, 2, 2)}"></span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Cupons -->
            <div class="card">
                <div class="titulo-com-link">
                    <h2>Cupons</h2>
                    <button type="button" id="btnVerCupons">Meus cupons</button>
                </div>

                <!-- Cupons selecionados -->
                <input type="text"
                       class="campo-cupom"
                       id="campoCupom"
                       placeholder="Digite o código do cupom">

                <div id="cuponsSelecionados" class="cupons-selecionados" hidden></div>

                <div class="aviso">
                    <span>Apenas um cupom promocional pode ser utilizado por compra.</span>
                </div>
            </div>

            <!-- Pagamento -->
            <div class="card">
                <div class="titulo-com-link">
                    <h2>Pagamento</h2>
                    <button type="button" id="btnCadastrarCartao">Adicionar Cartão</button>
                </div>

                <div class="aviso">
                    <span id="avisoMinimoCartao">O valor mínimo por cartão é de R$ 10,00</span>
                </div>

                <!-- Cartões -->
                <div class="cartao-container">

                    <!-- Mostrar outros cartões -->
                    <label class="adicionar-outro-cartao">
                        <input type="checkbox"
                               id="mostrarOutrosCartoes"
                               class="checkbox-cartoes">

                        <h4>Adicionar mais um cartão</h4>
                    </label>

                    <!-- Cartão preferencial -->
                    <div th:each="cartao : ${cliente.cartoes}"
                         th:if="${cartao.preferencial}"
                         class="cartao-item">

                        <label class="cartao">
                            <input type="checkbox"
                                   name="cartao"
                                   th:value="${cartao.id}"
                                   class="checkbox-cartao">

                            <div class="dados-cartao">
                                <h2 class="preferencial">Preferencial</h2>
                                <h3 th:text="${cartao.bandeira.descricao}"></h3>
                                <span th:text="${'**** **** **** ' + cartao.numero.substring(cartao.numero.length() - 4)}"></span>
                                <span th:text="${cartao.nomeImpresso}"></span>
                            </div>
                        </label>

                        <!-- Valor do cartão -->
                        <div class="campo-valor-cartao">
                            <label th:for="'valorCartao' + ${cartao.id}">
                                Valor a pagar com este cartão
                            </label>

                            <div class="input-valor">
                                <span>R$</span>

                                <input inputmode="decimal"
                                       th:id="'valorCartao' + ${cartao.id}"
                                       th:name="'valoresCartoes[' + ${cartao.id} + ']'"
                                       form="formFinalizarCompra"
                                       min="0.01"
                                       step="0.01"
                                       value="10.00"
                                       placeholder="Digite o valor">
                            </div>
                        </div>
                    </div>

                    <div th:if="${cartoesTemporarios != null and !cartoesTemporarios.isEmpty()}"
                         class="cartao-temporario">

                        <div th:each="cartao : ${cartoesTemporarios}">

                            <label class="cartao">
                                <input type="hidden"
                                       name="cartaoTemporarioId"
                                       th:value="${cartao.id}"
                                       form="formFinalizarCompra">


                                <input type="checkbox"
                                       name="cartao"
                                       th:value="${cartao.id}"
                                       class="checkbox-cartao-temporario">

                                <div class="container-cartao">
                                    <div class="dados-cartao">
                                        <h3 th:text="${cartao.bandeira.descricao}"></h3>
                                        <span th:text="'**** **** **** ' + ${cartao.numero.substring(cartao.numero.length() - 4)}"></span>
                                        <span th:text="${cartao.nomeImpresso}"></span>
                                    </div>

                                    <form th:action="@{/cliente/excluir-cartao-temporario}"
                                          method="post">

                                        <div th:each="itemId : ${itensSelecionados}">
                                            <input type="hidden" name="itensSelecionados" th:value="${itemId}">
                                        </div>

                                        <input type="hidden"
                                               name="cartaoTemporarioId"
                                               th:value="${cartao.id}">

                                        <button class="excluirCartao"
                                                type="submit"
                                                title="Excluir cartão">

                                            <i class="fa-solid fa-trash"></i>

                                        </button>
                                    </form>
                                </div>
                            </label>

                            <div class="campo-valor-cartao">
                                <label>Valor a pagar com este cartão</label>

                                <div class="input-valor">

                                    <span>R$</span>

                                    <input inputmode="decimal"
                                           name="valorCartaoTemporario"
                                           form="formFinalizarCompra"
                                           min="0.01"
                                           step="0.01"
                                           value="10.00">
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Outros cartões -->
                    <div id="outrosCartoes" hidden>
                        <div th:each="cartao : ${cliente.cartoes}"
                             th:if="${!cartao.preferencial}"
                             class="cartao-item">

                            <label class="cartao">
                                <input type="checkbox"
                                       name="cartao"
                                       th:value="${cartao.id}"
                                       class="checkbox-cartao">

                                <div class="dados-cartao">
                                    <h3 th:text="${cartao.bandeira.descricao}"></h3>

                                    <span th:text="'**** **** **** ' + ${cartao.numero.substring(cartao.numero.length() - 4)}"></span>
                                    <span th:text="${cartao.nomeImpresso}"></span>
                                </div>
                            </label>

                            <div class="campo-valor-cartao">
                                <label th:for="'valorCartao' + ${cartao.id}">
                                    Valor a pagar com este cartão
                                </label>

                                <div class="input-valor">
                                    <span>R$</span>

                                    <input inputmode="decimal"
                                           th:id="'valorCartao' + ${cartao.id}"
                                           th:name="'valoresCartoes[' + ${cartao.id} + ']'"
                                           form="formFinalizarCompra"
                                           min="10.00"
                                           step="0.01"
                                           value="10.00"
                                           placeholder="Digite o valor">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Coluna direita -->
        <form th:action="@{/cliente/finalizar-compra}"
              method="post"
              id="formFinalizarCompra"
              class="direito">

            <div class="linha-resumo">
                <h3>Subtotal</h3>
                <h3 id="subtotal">R$ 0,00</h3>
            </div>

            <div class="linha-resumo">
                <h3>Frete</h3>
                <h3 id="frete">R$ 0,00</h3>
            </div>

            <div class="linha-resumo cupom-resumo">
                <h3>Descontos</h3>
                <h3 id="desconto">-R$ 0,00</h3>
            </div>

            <div class="separador"></div>

            <div class="linha-total">
                <h3>Total</h3>
                <h3 id="total">R$ 0,00</h3>
            </div>

            <div th:each="itemId : ${itensSelecionados}">
                <input type="hidden" name="itensSelecionados" th:value="${itemId}">
            </div>

            <button type="submit" id="btnFinalizarCompra" class="btn-finalizar-a-compra">Finalizar a compra</button>

        </form>

        <!-- Toast de atenção -->
        <div id="toastAtencao" class="toast">
            <i class="fa-solid fa-triangle-exclamation"></i>
            <p></p>
        </div>

        <!-- Toast de erro -->
        <div id="toast"
             class="toast ativo"
             th:if="${mensagemToast}">

            <i th:if="${tipoToast == 'erro'}"
               class="fa-solid fa-circle-xmark"></i>

            <i th:if="${tipoToast != 'erro'}"
               class="fa-solid fa-check"></i>

            <p th:text="${mensagemToast}"></p>
        </div>

    </main>

    <!-- Modal de alterar endereço -->
    <div th:replace="~{fragments/cliente/modais :: modal-alterar-endereco}"></div>

    <!-- Modal de adicionar/editar endereço -->
    <div th:replace="~{fragments/cliente/modais :: modal-adicionar-endereco}"></div>

    <!-- Modal de cupons -->
    <div th:replace="~{fragments/cliente/modais :: modal-cupons}"></div>

    <!-- Modal de cadastrar cartão -->
    <div th:replace="~{fragments/cliente/modais :: modal-cadastrar-cartao}"></div>
</div>

<!-- Validações -->
<script th:src="@{/js/cliente/validacoes/endereco.js}"></script>
<script th:src="@{/js/cliente/validacoes/cartao.js}"></script>
<script th:src="@{/js/cliente/validacoes/geral.js}"></script>
<script th:src="@{/js/cliente/validacoes/cupom.js}"></script>

<!-- Toast.js -->
<script th:src="@{/js/cliente/componentes/toast.js}"></script>

<!-- Finalizar compra JavaScript -->
<script th:src="@{/js/cliente/finalizar-compra.js}"></script>

<!-- Finalizar compra endereço JavaScript -->
<script th:src="@{/js/cliente/finalizar-compra-endereco.js}"></script>

<!-- Finalizar compra cartão JavaScript -->
<script th:src="@{/js/cliente/finalizar-compra-cartao.js}"></script>


</body>
</html>
