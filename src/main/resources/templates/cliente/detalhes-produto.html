<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes do produto</title>

    <!-- Font Awesome (Ícones) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Cabeçalho CSS -->
    <link rel="stylesheet" th:href="@{/css/cliente/cabecalho.css}">

    <!-- Global CSS -->
    <link rel="stylesheet" th:href="@{/css/cliente/global.css}">

    <!-- Detalhes do produto CSS -->
    <link rel="stylesheet" th:href="@{/css/cliente/detalhes-produto.css}">

    <!-- Chatbot -->
    <link rel="stylesheet" th:href="@{/css/cliente/chatbot.css}">
</head>
<body>

<div class="container">

    <!-- Cabeçalho -->
    <div th:replace="~{fragments/cliente/cabecalho :: cabecalho}"></div>

    <main class="conteudo">
        <!-- Card esquerda -->
        <div class="produto-detalhes">

            <!-- Paginas -->
            <div class="paginas">
                <a th:href="@{/cliente/produtos}">Produtos</a>
                <i class="fa-solid fa-chevron-right"></i>
                <span>Detalhes</span>
            </div>

            <!-- Informação do produto -->
            <div class="produto-info">
                <div class="imagem-container">
                    <img th:src="${produto.imagemUrl}">
                </div>

                <div class="info-principal">
                        <h1 th:text="${produto.nome}"></h1>

                    <div class="secao-descricao">
                        <h2>Descrição</h2>
                        <p th:text="${produto.descricao}"></p>
                    </div>

                    <div class="secao-tamanhos">
                        <h2>Tamanhos</h2>
                        <div class="opcoes-tamanho">
                            <button type="button"
                                    class="tamanho-opcao"
                                    th:each="variacao : ${produto.variacoes}"
                                    th:data-id="${variacao.id}"
                                    th:data-valor="${variacao.valorVenda}"
                                    th:data-estoque="${variacao.estoqueAtual}"
                                    th:text="${variacao.tamanho}">
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <span class="linha"></span>

            <!-- Especificações -->
            <div class="secao-especificacoes">
                <h3>Especificação</h3>

                <table class="tabela-especificacoes">
                    <tbody>
                    <tr>
                        <th>Marca</th>
                        <td th:text="${produto.marca}"></td>
                    </tr>
                        <th>Espécie</th>
                        <td>
                            <span th:each="especie : ${produto.especies}"
                                  th:text="${especie.nome + '   '}">
                            </span>
                        </td>
                    </tr>

                    <tr>
                        <th>Idade</th>
                        <td>
                            <span th:each="faixa : ${produto.faixasEtarias}"
                                  th:text="${faixa.nome + '   '}">
                            </span>
                        </td>
                    </tr>

                    <tr>
                        <th>Porte indicado</th>
                        <td>
                            <span th:each="porte : ${produto.portes}"
                                  th:text="${porte.nome + '   '}">
                            </span>
                        </td>
                    </tr>

                    <tr>
                        <th>Categoria</th>
                        <td th:text="${produto.categoria}"></td>
                    </tr>

                    <tr th:if="${produto.categoria == 'Ração'}">
                        <th>Tipo de ração</th>
                        <td th:text="${produto.tipoRacao.nome}"></td>
                    </tr>

                    <tr th:if="${produto.categoria == 'Ração'}">
                        <th>Tamanho do grão</th>
                        <td th:text="${produto.tamanhoGrao.nome}"></td>
                    </tr>

                    <tr th:if="${produto.categoria == 'Petisco'}">
                        <th>Tipo de petisco</th>
                        <td th:text="${produto.tipoPetisco.nome}"></td>
                    </tr>

                    <tr th:if="${produto.categoria == 'Suplemento'}">
                        <th>Forma de apresentação</th>
                        <td th:text="${produto.formaApresentacao.nome}"></td>
                    </tr>

                    <tr>
                        <th>Sabor</th>
                        <td>
                        <span th:each="sabor : ${produto.sabores}"
                              th:text="${sabor.nome} + '   '"></span>
                        </td>
                    </tr>

                    <tr>
                        <th>Composição nutricional</th>
                        <td th:text="${produto.composicaoNutricional}"></td>
                    </tr>

                    <tr>
                        <th>Transgênico</th>
                        <td>
                            <span th:if="${produto.contemTransgenico}">Sim</span>
                            <span th:if="${!produto.contemTransgenico}">Não</span>
                        </td>
                    </tr>

                    <tr>
                        <th>Glúten</th>
                        <td>
                            <span th:if="${produto.contemGluten}">Sim</span>
                            <span th:if="${!produto.contemGluten}">Não</span>
                        </td>
                    </tr>
                    </tbody>
                </table>

                <!-- Tabela de Dosagem Recomendada -->
                <table class="tabela-dosagem">
                    <thead>
                    <tr>
                        <th>Peso do animal</th>
                        <th>Quantidade recomendada</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="recomendacao : ${produto.quantidadeRecomendada}">
                        <td th:text="${recomendacao.pesoAnimal}"></td>
                        <td th:text="${recomendacao.quantidadeRecomendada}"></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Card Direita -->
        <div class="direito">
            <div class="preco-container">
                <span class="preco" id="precoProduto"></span>
            </div>

            <div class="quantidade-container">
                <label>Quantidade</label>
                <div class="seletor-quantidade">
                    <button type="button" class="btn-qtd menos">-</button>
                    <input type="number" value="1" min="1">
                    <button type="button" class="btn-qtd mais">+</button>
                </div>
            </div>

            <span id="mensagemEstoque" class="mensagem-erro"></span>

            <form id="formAdicionar" method="post">
                <!-- Para mostrar o caminho d volta para mensagem na tela de detalhes -->
                <input type="hidden" name="origem" value="detalhes">

                <input type="hidden" name="variacaoId">

                <input type="hidden" name="quantidade">

                <!-- Para o Controller saber de que produto se trata -->
                <input type="hidden" name="produtoId" th:value="${produto.id}">

                <button type="button" class="btn-adicionar-carrinho">Adicionar ao carrinho</button>
            </form>
        </div>

        <!-- Toast -->
        <div id="toast"
             class="toast ativo"
             th:if="${mensagemToast}">

            <i th:if="${tipoToast == 'erro'}"
               class="fa-solid fa-circle-xmark"></i>

            <i th:if="${tipoToast != 'erro'}"
               class="fa-solid fa-check"></i>

            <p th:text="${mensagemToast}"></p>
        </div>
    </main>
</div>

<!-- Detalhes do produto JavaScript -->
<script th:src="@{/js/cliente/detalhes-produto.js}"></script>

<!-- Toast JavaScript -->
<script th:src="@{/js/cliente/componentes/toast.js}"></script>

<!-- ChatBot -->
<div th:replace="~{fragments/cliente/chatbot :: chatbot}"></div>
<script th:src="@{/js/cliente/chatbot.js}"></script>

</body>
</html>
