<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produtos</title>

    <!-- Font Awesome (Ícones) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Cabeçalho CSS -->
    <link rel="stylesheet" th:href="@{/css/cliente/cabecalho.css}">

    <!-- Global CSS -->
    <link rel="stylesheet" th:href="@{/css/cliente/global.css}">

    <!-- Produtos CSS -->
    <link rel="stylesheet" th:href="@{/css/cliente/produtos.css}">

    <!-- Chatbot -->
    <link rel="stylesheet" th:href="@{/css/cliente/chatbot.css}">
</head>
<body>

<div class="container">
    <!-- Cabeçalho -->
    <div th:replace="~{fragments/cliente/cabecalho :: cabecalho}"></div>

    <main class="conteudo">
        <!-- Filtro -->
        <form id="formFiltro" th:action="@{/cliente/produtos}" method="GET">
            <div class="filtro">

                <div class="filtro-cabecalho">
                    <h1>Filtro</h1>

                    <a th:href="@{/cliente/produtos}" class="btn-limpar">
                        Limpar
                    </a>
                </div>

                <span class="linha"></span>

                <!-- Categoria -->
                <div class="filtro-categoria">

                    <h3>Categoria</h3>

                    <!-- Ração -->
                    <details open>
                        <summary>Ração</summary>

                        <button type="submit"
                                name="verTodos"
                                value="racao"
                                class="ver-todos">
                            Ver todas as rações
                        </button>

                        <label th:each="tipo : ${tiposRacao}">
                            <input type="checkbox"
                                   name="tipoRacao"
                                   th:value="${tipo.nome}"
                                   th:checked="${tipoRacaoSelecionados != null and tipoRacaoSelecionados.contains(tipo.nome)}">

                            <span th:text="${tipo.nome}"></span>
                        </label>
                    </details>

                    <!-- Petisco -->
                    <details open>
                        <summary>Petisco</summary>

                        <button type="submit"
                                name="verTodos"
                                value="petisco"
                                class="ver-todos">
                            Ver todos os petiscos
                        </button>

                        <label th:each="tipo : ${tiposPetisco}">
                            <input type="checkbox"
                                   name="tipoPetisco"
                                   th:value="${tipo.nome}"
                                   th:checked="${tipoPetiscoSelecionados != null and tipoPetiscoSelecionados.contains(tipo.nome)}">

                            <span th:text="${tipo.nome}"></span>
                        </label>
                    </details>

                    <!-- Suplemento -->
                    <details open>
                        <summary>Suplemento</summary>

                        <button type="submit"
                                name="verTodos"
                                value="suplemento"
                                class="ver-todos">
                            Ver todos os suplementos
                        </button>

                        <label th:each="forma : ${formasApresentacao}">
                            <input type="checkbox"
                                   name="formaApresentacao"
                                   th:value="${forma.nome}"
                                   th:checked="${formasApresentacaoSelecionadas != null and formasApresentacaoSelecionadas.contains(forma.nome)}">

                            <span th:text="${forma.nome}"></span>
                        </label>
                    </details>

                    <!-- Espécie -->
                    <div class="filtro-grupo">
                        <h3>Espécie</h3>

                        <label th:each="especie : ${especies}">
                            <input type="checkbox"
                                   name="especie"
                                   th:value="${especie.nome}"
                                   th:checked="${especiesSelecionadas != null and especiesSelecionadas.contains(especie.nome)}">

                            <span th:text="${especie.nome}"></span>
                        </label>
                    </div>

                    <!-- Idade -->
                    <div class="filtro-grupo">
                        <h3>Idade</h3>
                        <label th:each="idade : ${faixasEtarias}">
                            <input type="checkbox"
                                   name="idade"
                                   th:value="${idade.nome}"
                                   th:checked="${idadesSelecionadas != null and idadesSelecionadas.contains(idade.nome)}">

                            <span th:text="${idade.nome}"></span>
                        </label>

                    </div>

                    <!-- Porte -->
                    <div class="filtro-grupo">
                        <h3>Porte indicado</h3>
                        <label th:each="porte : ${portes}">
                            <input type="checkbox"
                                   name="porte"
                                   th:value="${porte.nome}"
                                   th:checked="${portesSelecionados != null and portesSelecionados.contains(porte.nome)}">

                            <span th:text="${porte.nome}"></span>
                        </label>
                    </div>

                    <!-- Características -->
                    <div class="filtro-grupo">

                        <span>Livre de transgênico</span>

                        <label>
                            <input type="radio"
                                   name="transgenico"
                                   value="true"
                                   th:checked="${transgenicoSelecionado == true}">
                            Sim
                        </label>

                        <label>
                            <input type="radio"
                                   name="transgenico"
                                   value="false"
                                   th:checked="${transgenicoSelecionado == false}">
                            Não
                        </label>

                        <span>Contém glúten</span>

                        <label>
                            <input type="radio"
                                   name="gluten"
                                   value="true"
                                   th:checked="${glutenSelecionado == true}">
                            Sim
                        </label>

                        <label>
                            <input type="radio"
                                   name="gluten"
                                   value="false"
                                   th:checked="${glutenSelecionado == false}">
                            Não
                        </label>
                    </div>

                    <!-- Preço -->
                    <div class="filtro-preco">
                        <h3>Preço</h3>

                        <div class="precos">

                            <div>
                                <label for="precoMinimo">Mínimo</label>

                                <input type="number"
                                       id="precoMinimo"
                                       name="precoMinimo"
                                       min="0.01"
                                       step="0.01"
                                       th:value="${precoMinimo}"
                                       placeholder="R$ 0,00">
                            </div>

                            <div>
                                <label for="precoMaximo">Máximo</label>

                                <input type="number"
                                       id="precoMaximo"
                                       name="precoMaximo"
                                       min="0.01"
                                       step="0.01"
                                       th:value="${precoMaximo}"
                                       placeholder="R$ 0,00">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </form>

        <div class="produtos-container">
            <h1>Produtos</h1>

            <div class="produtos-linha">
                <div class="produto" th:each="produto : ${produtos}">
                    <a th:href="@{/cliente/detalhes-produto/{id}(id=${produto.id})}" class="produto-link">
                        <img class="produto-imagem" th:src="${produto.imagemUrl}">

                        <div class="produto-info">
                            <p class="produto-titulo" th:text="${produto.nome}"></p>
                            <h3 class="produto-preco">
                                R$ <span th:text="${#numbers.formatDecimal(produto.valorMinimo, 2, 2)}"></span>
                            </h3>
                        </div>
                    </a>

                    <form th:action="@{/cliente/carrinho/adicionar}" method="post">
                        <input type="hidden"
                               name="variacaoId"
                               th:value="${produto.variacoes[0].id}">

                        <input type="hidden"
                               name="quantidade"
                               value="1">

                        <button type="submit" class="btn-adicionar">
                            Adicionar
                        </button>
                    </form>
                </div>
            </div>
            <div class="sem-resultados" th:if="${produtos.isEmpty()}">
                <p>Sem resultados.</p>
            </div>
        </div>

        <!-- Toast -->
        <div id="toast"
             class="toast ativo"
             th:if="${mensagemToast}">

            <i th:if="${tipoToast == 'erro'}"
               class="fa-solid fa-circle-xmark"></i>

            <i th:if="${tipoToast != 'erro'}"
               class="fa-solid fa-check"></i>

            <p th:text="${mensagemToast}"></p>
        </div>
    </main>
</div>

<!-- Produto -->
<script th:src="@{/js/cliente/produtos.js}"></script>

<!-- Toast JavaScript -->
<script th:src="@{/js/cliente/componentes/toast.js}"></script>

<!-- ChatBot -->
<div th:replace="~{fragments/cliente/chatbot :: chatbot}"></div>
<script th:src="@{/js/cliente/chatbot.js}"></script>

</body>
</html>
