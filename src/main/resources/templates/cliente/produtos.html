<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produtos</title>

    <!-- Font Awesome (Ícones) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Cabeçalho CSS -->
    <link rel="stylesheet" th:href="@{/css/cliente/cabecalho.css}">

    <!-- Global CSS -->
    <link rel="stylesheet" th:href="@{/css/cliente/global.css}">

    <!-- Produtos CSS -->
    <link rel="stylesheet" th:href="@{/css/cliente/produtos.css}">

    <!-- Chatbot -->
    <link rel="stylesheet" th:href="@{/css/cliente/chatbot.css}">
</head>
<body>

<div class="container">
    <!-- Cabeçalho -->
    <div th:replace="~{fragments/cliente/cabecalho :: cabecalho}"></div>

    <main class="conteudo">
        <!-- Filtro -->
        <div class="filtro">
            <div class="filtro-cabecalho">
                <h1>Filtro</h1>
                <button type="button" class="btn-limpar">Limpar</button>
            </div>

            <span class="linha"></span>

            <!-- Categoria -->
            <div class="filtro-categoria">
                <h3>Categoria</h3>

                <!-- Ração -->
                <details>
                    <summary>Ração</summary>
                    <a href="#" class="ver-todos">Ver todas as rações</a>

                    <label>
                        <input type="checkbox" name="tipoRacao" value="seca">
                        <span>Seca</span>
                    </label>

                    <label>
                        <input type="checkbox" name="tipoRacao" value="natural">
                        <span>Natural</span>
                    </label>

                    <label>
                        <input type="checkbox" name="tipoRacao" value="umida">
                        <span>Úmida</span>
                    </label>

                    <label>
                        <input type="checkbox" name="tipoRacao" value="medicamentosa">
                        <span>Medicamentosa</span>
                    </label>
                </details>

                <!-- Petisco -->
                <details>
                    <summary>Petisco</summary>
                    <a href="#" class="ver-todos">Ver todos os petiscos</a>

                    <label>
                        <input type="checkbox" name="tipoPetisco" value="bifinhos">
                        <span>Bifinhos</span>
                    </label>

                    <label>
                        <input type="checkbox" name="tipoPetisco" value="biscoitos">
                        <span>Biscoitos e snacks</span>
                    </label>

                    <label>
                        <input type="checkbox" name="tipoPetisco" value="molho">
                        <span>Molho</span>
                    </label>

                    <label>
                        <input type="checkbox" name="tipoPetisco" value="cremoso">
                        <span>Petisco cremoso</span>
                    </label>

                    <label>
                        <input type="checkbox" name="tipoPetisco" value="natural">
                        <span>Petisco natural</span>
                    </label>

                    <label>
                        <input type="checkbox" name="tipoPetisco" value="osso">
                        <span>Osso</span>
                    </label>
                </details>

                <!-- Suplemento -->
                <details>
                    <summary>Suplemento</summary>
                    <a href="#" class="ver-todos">Ver todos os suplementos</a>

                    <label>
                        <input type="checkbox" name="tipoSuplemento" value="comprimidos">
                        <span>Comprimidos e cápsulas</span>
                    </label>

                    <label>
                        <input type="checkbox" name="tipoSuplemento" value="mastigaveis">
                        <span>Tabletes mastigáveis</span>
                    </label>

                    <label>
                        <input type="checkbox" name="tipoSuplemento" value="po">
                        <span>Pó e líquidos</span>
                    </label>
                </details>
            </div>

            <!-- Espécie -->
            <div class="filtro-grupo">
                <h3>Espécie</h3>

                <label>
                    <input type="checkbox" name="especie" value="cachorro">
                    <span>Cachorro</span>
                </label>

                <label>
                    <input type="checkbox" name="especie" value="gato">
                    <span>Gato</span>
                </label>

            </div>

            <!-- Idade -->
            <div class="filtro-grupo">
                <h3>Idade</h3>

                <label>
                    <input type="checkbox" name="idade" value="adulto">
                    <span>Adulto</span>
                </label>

                <label>
                    <input type="checkbox" name="idade" value="filhote">
                    <span>Filhote</span>
                </label>

                <label>
                    <input type="checkbox" name="idade" value="idoso">
                    <span>Idoso</span>
                </label>

            </div>

            <!-- Porte -->
            <div class="filtro-grupo">
                <h3>Porte indicado</h3>

                <label>
                    <input type="checkbox" name="porte" value="pequeno">
                    <span>Pequeno</span>
                </label>

                <label>
                    <input type="checkbox" name="porte" value="medio">
                    <span>Médio</span>
                </label>

                <label>
                    <input type="checkbox" name="porte" value="grande">
                    <span>Grande</span>
                </label>
            </div>


            <!-- Características -->
            <div class="filtro-grupo">
                <h3>Característica do produto</h3>

                <label>
                    <input type="checkbox" name="caracteristica" value="transgenico">
                    <span>Livre de transgênico</span>
                </label>

                <label>
                    <input type="checkbox" name="caracteristica" value="gluten">
                    <span>Não contém glúten</span>
                </label>
            </div>

            <!-- Preço -->
            <div class="filtro-preco">
                <h3>Preço</h3>

                <div class="precos">
                    <div>
                        <label for="precoMinimo">Mínimo</label>
                        <input type="number"
                                id="precoMinimo"
                                name="precoMinimo"
                                min="0.01"
                                placeholder="R$ 0,00">
                    </div>

                    <div>
                        <label for="precoMaximo">Máximo</label>
                        <input type="number"
                                id="precoMaximo"
                                name="precoMaximo"
                                min="0.01"
                                placeholder="R$ 0,00">
                    </div>
                </div>
            </div>
        </div>

        <div class="produtos-container">
            <h1>Produtos</h1>

            <div class="produtos-linha">
                <div class="produto" th:each="produto : ${produtos}">
                    <a th:href="@{/cliente/detalhes-produto/{id}(id=${produto.id})}" class="produto-link">
                        <img class="produto-imagem" th:src="${produto.imagemUrl}">

                        <div class="produto-info">
                            <p class="produto-titulo" th:text="${produto.nome}"></p>
                            <h3 class="produto-preco">
                                R$ <span th:text="${#numbers.formatDecimal(produto.valorMinimo, 2, 2)}"></span>
                            </h3>
                        </div>
                    </a>

                    <button type="button" class="btn-adicionar">Adicionar</button>
                </div>
            </div>
        </div>
    </main>
</div>

<!-- ChatBot -->
<div th:replace="~{fragments/cliente/chatbot :: chatbot}"></div>
<script th:src="@{/js/cliente/chatbot.js}"></script>

</body>
</html>
